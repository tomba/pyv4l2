[build-system]
requires = ['setuptools >= 61.0']
build-backend = 'setuptools.build_meta'

[project]
name = 'pyv4l2'
version = '0.1'
dependencies = [
  'pixutils @ git+https://github.com/tomba/pixutils.git',
]
requires-python = '>=3.10'
authors = [
  { name = 'Tomi Valkeinen', email = 'tomi.valkeinen@ideasonboard.com' },
]
maintainers = [
  { name = 'Tomi Valkeinen', email = 'tomi.valkeinen@ideasonboard.com' },
]
description = 'Pure-Python V4L2 bindings'
readme = 'README.md'
license = { file = 'LICENSE.md' }
keywords = ['linux', 'v4l2']
classifiers = [
  'Programming Language :: Python',
  'License :: OSI Approved :: GNU Lesser General Public License v3 (LGPLv3)',
  'Development Status :: 4 - Beta',
  'Operating System :: POSIX :: Linux',
]

[project.urls]
Homepage = 'https://github.com/tomba/pyv4l2'
Repository = 'https://github.com/tomba/pyv4l2.git'
'Bug Tracker' = 'https://github.com/tomba/pyv4l2/issues'

[tool.setuptools]
packages = ['v4l2', 'v4l2.uapi']

[tool.pytest.ini_options]
testpaths = ['tests']

[tool.ruff]
line-length = 100
extend-exclude = ['v4l2/uapi/']

[tool.ruff.lint]
extend-select = [
  'E',   # pycodestyle errors
  'W',   # pycodestyle warnings
  'F',   # Pyflakes: undefined/unused names, bad imports, f-string mistakes
  'FA',  # flake8-future-annotations: require `from __future__ import annotations`
  'Q',   # flake8-quotes: quote style, configured under lint.flake8-quotes below
  'UP',  # pyupgrade: rewrite idioms obsolete for our minimum Python
  'PLE', # Pylint errors: things that are outright broken
  'PLW', # Pylint warnings: suspicious but legal constructs
]
ignore = [
  'E741',  # ambiguous-variable-name: rejects `l`, `O`, `I` as names
  'E501',  # line-too-long
  'UP032', # f-string: rewrite `'{}'.format(x)` as an f-string
]

[tool.ruff.lint.per-file-ignores]
'__init__.py' = ['F401', 'F403']

[tool.ruff.lint.flake8-quotes]
inline-quotes = 'single'
multiline-quotes = 'double' # only 'double' is compatible with the formatter

[tool.ruff.format]
quote-style = 'single'

[project.optional-dependencies]
test = ['pytest']
utils = [
    'numpy',
    'pykms @ git+https://github.com/tomba/pykms.git',
    'PyQt6',
    'ipython',
]
all = ['pyv4l2[utils,test]']
